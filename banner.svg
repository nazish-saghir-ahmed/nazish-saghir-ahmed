<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" role="img" aria-label="Nazish Saghir Ahmed, Security Engineer and Researcher. Building at the edge of security, code, and AI." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#2A3140" opacity="0.7"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0A0C10" stop-opacity="1"/>
      <stop offset="0.55" stop-color="#0A0C10" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4F7CE0" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#4F7CE0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- base -->
  <rect width="1280" height="340" fill="#0A0C10"/>
  <rect width="1280" height="340" fill="url(#dots)"/>
  <rect width="1280" height="340" fill="url(#fade)"/>
  <circle cx="1030" cy="170" r="230" fill="url(#glow)"/>
  <rect x="0" y="0" width="6" height="340" fill="#4F7CE0"/>

  <!-- shield motif -->
  <g transform="translate(1030 170)" fill="none" stroke="#4F7CE0" stroke-linecap="round" stroke-linejoin="round">
    <circle r="150" stroke-opacity="0.12" stroke-width="1"/>
    <circle r="112" stroke-opacity="0.18" stroke-width="1" stroke-dasharray="3 9"/>
    <path d="M0,-92 L72,-64 V10 C72,60 36,88 0,106 C-36,88 -72,60 -72,10 V-64 Z"
          fill="#4F7CE0" fill-opacity="0.07" stroke-opacity="0.75" stroke-width="2"/>
    <path d="M0,-72 L54,-50 V8 C54,46 26,68 0,82 C-26,68 -54,46 -54,8 V-50 Z"
          stroke-opacity="0.25" stroke-width="1"/>
    <!-- lock -->
    <rect x="-20" y="-6" width="40" height="34" rx="5" fill="#0A0C10" stroke-opacity="0.9" stroke-width="2.5"/>
    <path d="M-11,-6 V-18 a11,11 0 0 1 22,0 V-6" stroke-opacity="0.9" stroke-width="2.5"/>
    <circle cx="0" cy="10" r="3.5" fill="#4F7CE0" stroke="none"/>
    <path d="M0,13 V20" stroke-opacity="0.9" stroke-width="2.5"/>
  </g>

  <!-- name + role -->
  <text x="96" y="128" font-family="Georgia, 'Times New Roman', serif" font-size="60" font-weight="700" fill="#F2F4F8">Nazish Saghir Ahmed</text>
  <text x="98" y="172" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-style="italic" fill="#7FA2F0">Security Engineer &amp; Researcher</text>
  <rect x="98" y="188" width="280" height="2" fill="#4F7CE0"/>

  <!-- intro -->
  <text x="98" y="228" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" fill="#B4BCCB">I find weaknesses before attackers do, and build secure code and AI systems that hold up.</text>

  <!-- focus areas -->
  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#D6DCE8" text-anchor="middle">
    <rect x="98" y="258" width="180" height="36" rx="18" fill="#4F7CE0" fill-opacity="0.08" stroke="#4F7CE0" stroke-opacity="0.55"/>
    <text x="188" y="281">Offensive Security</text>

    <rect x="292" y="258" width="176" height="36" rx="18" fill="#4F7CE0" fill-opacity="0.08" stroke="#4F7CE0" stroke-opacity="0.55"/>
    <text x="380" y="281">Threat Detection</text>

    <rect x="482" y="258" width="140" height="36" rx="18" fill="#4F7CE0" fill-opacity="0.08" stroke="#4F7CE0" stroke-opacity="0.55"/>
    <text x="552" y="281">Secure Code</text>

    <rect x="636" y="258" width="128" height="36" rx="18" fill="#4F7CE0" fill-opacity="0.08" stroke="#4F7CE0" stroke-opacity="0.55"/>
    <text x="700" y="281">AI Security</text>
  </g>
</svg>
