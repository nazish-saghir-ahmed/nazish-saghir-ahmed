<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0c0f14"/>
      <stop offset="100%" stop-color="#090b0f"/>
    </linearGradient>
    <pattern id="dots" width="42" height="42" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1.1" fill="#1c2129"/>
    </pattern>
    <linearGradient id="dotsFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0c0f14" stop-opacity="1"/>
      <stop offset="45%" stop-color="#0c0f14" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect x="480" width="720" height="300" fill="url(#dots)"/>
  <rect x="480" width="720" height="300" fill="url(#dotsFade)"/>

  <!-- left accent spine -->
  <rect x="0" y="0" width="4" height="300" fill="#5B8DEF"/>

  <!-- name -->
  <text x="90" y="132" font-family="'Helvetica Neue', Arial, sans-serif" font-size="52" font-weight="300" letter-spacing="1" fill="#EDEFF2">
    Nazish Saghir Ahmed
  </text>

  <!-- rule -->
  <rect x="92" y="158" width="360" height="2" fill="#5B8DEF"/>

  <!-- role -->
  <text x="90" y="196" font-family="'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="400" fill="#AEB6C2">
    BS Cybersecurity Student — UET Lahore
  </text>

  <!-- supporting line -->
  <text x="90" y="228" font-family="'Fira Code', monospace" font-size="14" fill="#6B7481">
    Python &#183; Java &#183; Applied AI &#183; Offensive Security
  </text>

  <!-- quiet cursor accent -->
  <rect x="90" y="238" width="9" height="14" fill="#5B8DEF">
    <animate attributeName="opacity" values="1;0;1" dur="1.4s" repeatCount="indefinite"/>
  </rect>
</svg>
