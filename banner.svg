<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0c0f14"/>
      <stop offset="100%" stop-color="#090b0f"/>
    </linearGradient>
    <pattern id="dots" width="42" height="42" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1.1" fill="#1c2129"/>
    </pattern>
    <linearGradient id="dotsFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0c0f14" stop-opacity="1"/>
      <stop offset="45%" stop-color="#0c0f14" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect x="560" width="640" height="300" fill="url(#dots)"/>
  <rect x="560" width="640" height="300" fill="url(#dotsFade)"/>

  <!-- left accent spine -->
  <rect x="0" y="0" width="4" height="300" fill="#5B8DEF"/>

  <!-- presence dot + intro line -->
  <circle cx="94" cy="52" r="4" fill="#5B8DEF">
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="108" y="57" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" font-style="italic" fill="#8A93A3">
    Hi, I'm
  </text>

  <!-- name, stylish serif italic -->
  <text x="90" y="118" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="50" font-weight="700" letter-spacing="0.5" fill="#EDEFF2">
    Nazish Saghir Ahmed
  </text>

  <!-- rule -->
  <rect x="92" y="140" width="330" height="2" fill="#5B8DEF"/>

  <!-- role -->
  <text x="90" y="174" font-family="'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="400" fill="#AEB6C2">
    BS Cybersecurity Student — UET Lahore
  </text>

  <!-- tools line -->
  <text x="90" y="204" font-family="'Fira Code', monospace" font-size="14" fill="#6B7481">
    Python &#183; Java &#183; SQL &#183; Applied AI &#183; Offensive Security
  </text>

  <!-- practice line -->
  <text x="90" y="228" font-family="'Fira Code', monospace" font-size="13" fill="#565f6c">
    Practicing on Hack The Box &amp; TryHackMe
  </text>
</svg>
