<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="glow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#1a1030" stop-opacity="1"/>
      <stop offset="60%" stop-color="#0a0a0f" stop-opacity="1"/>
      <stop offset="100%" stop-color="#05050a" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="50%" stop-color="#22D3EE" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="frame"><rect x="0" y="0" width="1200" height="300" rx="14"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="300" fill="url(#glow)"/>

    <!-- faint falling code columns -->
    <g font-family="'Fira Code', monospace" font-size="13" fill="#2fae8b" opacity="0.16">
      <text x="70" y="0">01 10 1F 0A E3 9B 41 22 C0 7D 55 9E</text>
      <text x="70" y="18">4B 88 D2 01 F9 3C 6E A0 17 5D BB 02</text>
      <text x="420" y="0">7F 3A 90 CC 11 4E 88 2B D5 60 91 0F</text>
      <text x="420" y="18">A1 09 7C 3D E2 66 F0 12 8A 5B 90 D4</text>
      <text x="980" y="0">2C 91 4F E8 77 0A B3 5D 99 10 6E C2</text>
      <text x="980" y="18">6D F1 08 A7 3E 90 5C 22 B9 40 DE 71</text>
    </g>

    <!-- scan-line sweep -->
    <rect x="0" y="0" width="1200" height="60" fill="url(#scan)">
      <animate attributeName="y" values="-60;300" dur="3.4s" repeatCount="indefinite"/>
    </rect>

    <!-- HUD corner brackets -->
    <g stroke="#8B5CF6" stroke-width="2.5" fill="none" opacity="0.85">
      <path d="M20,44 L20,20 L44,20"/>
      <path d="M1156,20 L1180,20 L1180,44"/>
      <path d="M1180,256 L1180,280 L1156,280"/>
      <path d="M44,280 L20,280 L20,256"/>
    </g>

    <!-- small tag, top-left -->
    <text x="46" y="38" font-family="'Fira Code', monospace" font-size="12" letter-spacing="2" fill="#6e7681">OSINT // OFFENSIVE SECURITY // AI</text>

    <!-- status, top-right -->
    <g font-family="'Fira Code', monospace" font-size="12" fill="#6e7681">
      <circle cx="1108" cy="34" r="4" fill="#22c55e">
        <animate attributeName="opacity" values="1;0.25;1" dur="1.6s" repeatCount="indefinite"/>
      </circle>
      <text x="1120" y="38">SYSTEM: LEARNING</text>
    </g>

    <!-- glitch-style name -->
    <g font-family="'Fira Code', monospace" font-size="52" font-weight="700" text-anchor="middle">
      <text x="602" y="158" fill="#22D3EE" opacity="0.55">NAZISH SAGHIR AHMED</text>
      <text x="598" y="152" fill="#8B5CF6" opacity="0.55">NAZISH SAGHIR AHMED</text>
      <text x="600" y="155" fill="#f2f4f8" filter="url(#soft)">NAZISH SAGHIR AHMED</text>
    </g>

    <!-- subtitle -->
    <text x="600" y="196" text-anchor="middle" font-family="'Fira Code', monospace" font-size="16" fill="#a7b0bd">
      BS Cybersecurity, UET Lahore &#183; Python &#183; Java &#183; AI &#183; Offensive Security
    </text>

    <!-- underline accent -->
    <rect x="450" y="212" width="300" height="2" fill="#8B5CF6" opacity="0.7"/>

    <!-- bottom prompt -->
    <g font-family="'Fira Code', monospace" font-size="14" fill="#6e7681">
      <text x="600" y="252" text-anchor="middle">
        <tspan fill="#22D3EE">$</tspan> still learning &#8594; still building &#8594; still breaking things
      </text>
    </g>
  </g>
</svg>
